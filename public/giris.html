<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galatasaray SK - Üye Girişi">
    <title>Giriş Yap | Galatasaray SK</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-gs">
    <div class="container">
        <a class="gs-logo" href="index.html">
            <div class="gs-crest">GS</div>
            <div class="gs-name">
                <span class="main-name">GALATASARAY</span>
                <span class="sub-name">Spor Kulübü</span>
            </div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                <li class="nav-item"><a class="nav-link" href="haberler.html">Haberler</a></li>
                <li class="nav-item"><a class="nav-link" href="hakkimizda.html">Hakkımızda</a></li>
                <li class="nav-item"><a class="nav-link" href="iletisim.html">İletişim</a></li>
            </ul>
            <div class="navbar-nav" id="authButtons">
                <a class="nav-link btn-nav-login active me-2" href="giris.html">Giriş Yap</a>
                <a class="nav-link btn-nav-register" href="kayit.html">Kayıt Ol</a>
            </div>
        </div>
    </div>
</nav>

<main class="form-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="form-card">
                    <div class="form-card-header">
                        <div class="gs-crest">GS</div>
                        <h2>Giriş Yap</h2>
                        <p>Hesabınıza erişin</p>
                    </div>
                    <div class="form-card-body">

                        <div class="alert-box alert-success" id="alertSuccess"></div>
                        <div class="alert-box alert-error" id="alertError"></div>

                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    <i class="fas fa-envelope me-1 text-gs-red"></i>E-posta Adresi
                                </label>
                                <input type="email" class="form-control" id="email" placeholder="ornek@email.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="sifre" class="form-label">
                                    <i class="fas fa-lock me-1 text-gs-red"></i>Şifre
                                </label>
                                <input type="password" class="form-control" id="sifre" placeholder="Şifreniz" required>
                            </div>
                            <button type="submit" class="btn-gs-submit">
                                <i class="fas fa-sign-in-alt me-2"></i>Giriş Yap
                            </button>
                            <p class="text-center mt-3 text-muted" style="font-size:0.9rem;">
                                Hesabınız yok mu? <a href="kayit.html" class="text-gs-red fw-bold">Kayıt Ol</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2026 Galatasaray Spor Kulübü Fan Sitesi | Web Teknolojileri Ödevi</p>
        </div>
    </div>
</footer>

<div class="theme-switcher">
    <div class="theme-panel" id="themePanel">
        <h6><i class="fas fa-palette me-2"></i>Tema Rengi</h6>
        <div class="color-options">
            <div class="color-option" data-theme="gs-original" style="background:#E8252A;"></div>
            <div class="color-option" data-theme="gs-dark" style="background:#1a1a2e;"></div>
            <div class="color-option" data-theme="gs-blue" style="background:#0d3b6e;"></div>
            <div class="color-option" data-theme="gs-green" style="background:#1a6b3a;"></div>
        </div>
    </div>
    <button class="theme-btn" onclick="toggleThemePanel()"><i class="fas fa-palette"></i></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script src="js/giris.js"></script>
</body>
</html>
